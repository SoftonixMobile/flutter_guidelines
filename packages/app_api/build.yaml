targets:
  $default:
    builders:
      freezed:freezed:
        enabled: true
        generate_for:
          include:
            - lib/src/models/**.dart
        options:
          format: true
          makeCollectionsUnmodifiable: false
          # legacy
          map: false
          maybeMap: false
          mapOrNull: false
          when: false
          maybeWhen: false
          whenOrNull: false
      json_serializable:
        enabled: true
        generate_for:
          include:
            - lib/src/models/**.dart
      injectable_generator:injectable_builder:
        enabled: true
        generate_for:
          include:
            - lib/src/services/**
      injectable_generator:injectable_config_builder:
        enabled: true
        generate_for:
          include:
            - lib/src/injector/inject_package.dart
